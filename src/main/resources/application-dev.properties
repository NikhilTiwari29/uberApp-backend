spring.application.name=uberApp

#DB configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?useSSL=false}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

#security config
jwt.secretKey=${JWT_SECRET_KEY:local-dev-only-secret-key-change-before-production-1234567890}
